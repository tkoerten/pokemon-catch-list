name: Check availability freshness

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dated opportunities
        id: availability
        continue-on-error: true
        run: npm run check:availability
      - name: Open one refresh reminder
        if: steps.availability.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Refresh current Pokémon GO availability";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            if (!issues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: "The automated freshness check found that current/upcoming availability is missing or more than three days old. Review official Pokémon GO announcements, update sourced entries in `scripts/seed-data.mjs`, regenerate data, and run `npm run check`."
              });
            }
      - name: Close resolved refresh reminder
        if: steps.availability.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Refresh current Pokémon GO availability";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const issue = issues.find((item) => item.title === title);
            if (issue) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
